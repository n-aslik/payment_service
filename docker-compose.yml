version: '3.8'

services:
  # База данных Postgres

  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aasl8998
      POSTGRES_DB: firstdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firstdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  # Брокер сообщений RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"   # Порт для кода
      - "15672:15672" # Порт для админки (логин: guest, пароль: guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Твой FastAPI сервис
  web:
    build: .
    # Команда запуска: указываем хост 0.0.0.0, чтобы Docker пропустил трафик
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE=firstdb
      - USER=postgres
      - PASSWORD=aasl8998
      - HOST=db
      - PORT=5432
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - PAYMENT_URL=http://web:8000/pay
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  